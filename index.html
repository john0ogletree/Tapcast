<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapCast - Serverless Screen Share</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS CDN for WebRTC signaling without a custom server -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-6">

    <!-- Custom Modal for Alerts/Errors (Replacing alert()) -->
    <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center">
            <h3 id="modalTitle" class="text-lg font-bold mb-2 text-rose-400">Notice</h3>
            <p id="modalMessage" class="text-sm text-slate-300 mb-6 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2.5 rounded-xl transition">Got it</button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-md mx-auto flex flex-col items-center flex-1 justify-center">
        
        <!-- App Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600/20 text-indigo-400 mb-4 border border-indigo-500/30">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold tracking-tight">TapCast</h1>
            <p class="text-sm text-slate-400 mt-1">Instant, serverless phone screen sharing</p>
        </div>

        <!-- Host View (Default) -->
        <div id="hostView" class="w-full flex flex-col items-center">
            <div id="setupCard" class="w-full bg-slate-900/60 border border-slate-800/80 rounded-3xl p-6 shadow-xl backdrop-blur-md text-center">
                <div id="statusBadge" class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 text-xs font-semibold mb-6 border border-amber-500/20">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    Connecting to relay network...
                </div>

                <button id="startBtn" onclick="startStreaming()" disabled class="w-full bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-500 text-white font-semibold py-4 px-6 rounded-2xl shadow-lg shadow-indigo-600/20 transition-all duration-200 cursor-pointer disabled:cursor-not-allowed">
                    Start Sharing Screen
                </button>

                <div id="linkBox" class="hidden mt-6 text-left">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Viewer Share Link</label>
                    <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-xl p-2">
                        <input id="shareInput" type="text" readonly class="bg-transparent text-xs text-slate-300 w-full px-2 outline-none select-all">
                        <button onclick="copyLink()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3 py-2 rounded-lg transition shrink-0">Copy</button>
                    </div>
                </div>
            </div>

            <!-- Local Video Preview -->
            <div class="w-full mt-6">
                <video id="localVideo" autoplay playsinline muted class="w-full rounded-2xl border border-slate-800 bg-black hidden shadow-lg max-h-[300px] object-contain"></video>
            </div>
        </div>

        <!-- Viewer View (Rendered dynamically if URL has ?view=) -->
        <div id="viewerView" class="w-full hidden flex flex-col items-center">
            <div class="w-full bg-slate-900/60 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl relative">
                <div class="absolute top-4 left-4 z-10 bg-black/60 backdrop-blur-md px-3 py-1 rounded-full border border-white/10 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="text-xs font-medium text-emerald-300">Live Stream</span>
                </div>
                <video id="remoteVideo" autoplay playsinline controls class="w-full bg-black aspect-[9/16] object-contain"></video>
            </div>
            <p class="text-xs text-slate-500 mt-4 text-center">Powered by WebRTC • Peer-to-Peer Connection</p>
        </div>

    </div>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-600 mt-8">
        No accounts • No servers • Direct browser streaming
    </footer>

    <script>
        // Custom message box handler
        function showModal(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
        }

        // Initialize PeerJS broker connection
        const peer = new Peer();
        let activeStream = null;

        peer.on('open', (id) => {
            const badge = document.getElementById('statusBadge');
            badge.className = "inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-semibold mb-6 border border-emerald-500/20";
            badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Ready to Stream';
            
            document.getElementById('startBtn').removeAttribute('disabled');

            // Generate viewer URL
            const viewerUrl = `${window.location.origin}${window.location.pathname}?view=${id}`;
            document.getElementById('shareInput').value = viewerUrl;
        });

        peer.on('error', (err) => {
            showModal("Connection Error", "Could not connect to the signaling broker. Please check your network connection.");
        });

        // Check if current mode is Viewer
        const urlParams = new URLSearchParams(window.location.search);
        const hostId = urlParams.get('view');

        if (hostId) {
            // Switch UI to Viewer Mode
            document.getElementById('hostView').classList.add('hidden');
            document.getElementById('viewerView').classList.remove('hidden');

            const remoteVideo = document.getElementById('remoteVideo');

            // Connect to host and handle incoming media stream calls
            peer.on('call', (call) => {
                call.answer(); // Answer incoming call without local stream
                call.on('stream', (remoteStream) => {
                    remoteVideo.srcObject = remoteStream;
                });
            });

            // Fallback trigger if call doesn't initiate automatically
            setTimeout(() => {
                const conn = peer.connect(hostId);
            }, 1000);
        }

        // Host screen capture logic
        async function startStreaming() {
            try {
                // Pre-check for mobile webview limitations
                if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                    throw new Error("Screen sharing is restricted by this browser or app view. Please tap your browser menu (three dots) and select 'Open in Chrome' or 'Open in Safari'.");
                }

                // Request mobile system screen capture
                activeStream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: { frameRate: { ideal: 30, max: 60 } },
                    audio: false 
                });

                const videoEl = document.getElementById('localVideo');
                videoEl.srcObject = activeStream;
                videoEl.classList.remove('hidden');

                // Hide setup UI controls once streaming is active
                document.getElementById('linkBox').classList.remove('hidden');
                document.getElementById('startBtn').classList.add('hidden');
                document.getElementById('statusBadge').innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Streaming Active';

                // Listen for incoming viewer connections and send the stream
                peer.on('connection', (conn) => {
                    conn.on('open', () => {
                        peer.call(conn.peer, activeStream);
                    });
                });

                peer.on('call', (call) => {
                    call.answer(activeStream);
                });

                // Handle user stopping screen share via native mobile overlay button
                activeStream.getVideoTracks()[0].onended = () => {
                    stopStreaming();
                };

            } catch (err) {
                if (err.name !== 'NotAllowedError') {
                    showModal("Permission Notice", err.message);
                }
            }
        }

        function stopStreaming() {
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
            }
            window.location.reload();
        }

        function copyLink() {
            const input = document.getElementById('shareInput');
            input.select();
            input.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                event.target.innerText = "Copied!";
                setTimeout(() => { event.target.innerText = "Copy"; }, 2000);
            } catch (err) {
                showModal("Copy Failed", "Please manually select and copy the link.");
            }
        }
    </script>
</body>
</html>
